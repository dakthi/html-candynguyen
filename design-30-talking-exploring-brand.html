<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 30: Talking & Exploring Brand</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'Arial', sans-serif;
            background: #f8f9fa;
            color: #2c3e50;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            background: white;
            padding: 50px 40px;
            margin-bottom: 50px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(26, 77, 125, 0.1);
            position: relative;
        }

        header::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 5px;
            background: #8dc8a8;
            border-radius: 2px;
        }

        .logo-text {
            font-size: 2.8em;
            color: #1a4d7d;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .logo-and {
            color: #8dc8a8;
            font-weight: 400;
            font-size: 0.7em;
        }

        .tagline {
            font-size: 1.15em;
            color: #6c757d;
            font-weight: 400;
            margin-top: 15px;
        }

        .story-card {
            background: white;
            padding: 40px;
            margin-bottom: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .story-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: #8dc8a8;
            border-radius: 8px;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .story-card:hover::before {
            opacity: 1;
        }

        .story-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(26, 77, 125, 0.15);
        }

        .story-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f1f3f5;
        }

        .story-date {
            font-size: 0.95em;
            color: #1a4d7d;
            font-weight: 600;
            background: #e8f4f0;
            padding: 6px 16px;
            border-radius: 20px;
        }

        .story-badge {
            font-size: 0.85em;
            color: #8dc8a8;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .story-title {
            font-size: 1.7em;
            color: #1a4d7d;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .story-text {
            font-size: 1.1em;
            line-height: 1.8;
            color: #495057;
            margin-bottom: 25px;
        }

        .story-image {
            margin: 30px 0;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }


        .story-image img {
            width: 100%;
            display: block;
        }

        .story-footer {
            display: flex;
            gap: 30px;
            padding-top: 20px;
            border-top: 2px solid #f1f3f5;
        }

        .engagement-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1em;
            color: #6c757d;
        }

        .engagement-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1em;
            background: #8dc8a8;
            color: #1a4d7d;
            font-weight: 700;
        }

        .engagement-number {
            font-weight: 700;
            color: #1a4d7d;
        }

        #stories-container .loading {
            text-align: center;
            padding: 80px;
            color: #8dc8a8;
            font-size: 1.2em;
        }

        /* Decorative circle elements */
        .circle-decoration {
            position: fixed;
            border-radius: 50%;
            opacity: 0.05;
            pointer-events: none;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            background: #1a4d7d;
            top: 10%;
            right: -100px;
        }

        .circle-2 {
            width: 200px;
            height: 200px;
            background: #8dc8a8;
            bottom: 20%;
            left: -80px;
        }
    </style>
</head>
<body>
    <div class="circle-decoration circle-1"></div>
    <div class="circle-decoration circle-2"></div>

    <div class="container">
        <header>
            <h1 class="logo-text">TALKING <span class="logo-and">and</span> EXPLORING</h1>
            <p class="tagline">Community walks sharing stories & memories</p>
        </header>

        <div id="stories-container">
            <div class="loading">Loading community stories...</div>
        </div>
    </div>

    <script>
        const badges = ['Walk Story', 'Local Memory', 'Community Tale', 'Heritage Walk', 'Neighbourhood Story'];

        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('stories-container');
                container.innerHTML = '';

                posts.forEach((post, index) => {
                    const card = document.createElement('article');
                    card.className = 'story-card';

                    let displayText = post.text;
                    if (displayText.length > 450) {
                        displayText = displayText.substring(0, 450) + '...';
                    }

                    // Extract title
                    const firstSentence = displayText.split(/[.!?]/)[0];
                    const title = firstSentence.length > 75
                        ? firstSentence.substring(0, 75) + '...'
                        : firstSentence;

                    const badge = badges[index % badges.length];

                    let imageHTML = '';
                    if (post.images && post.images.length > 0) {
                        imageHTML = `
                            <div class="story-image">
                                <img src="../${post.images[0]}" alt="">
                            </div>
                        `;
                    }

                    card.innerHTML = `
                        <div class="story-header">
                            <span class="story-date">${post.date_formatted}</span>
                            <span class="story-badge">${badge}</span>
                        </div>
                        <h2 class="story-title">${title}</h2>
                        <div class="story-text">${displayText}</div>
                        ${imageHTML}
                        <div class="story-footer">
                            <div class="engagement-item">
                                <div class="engagement-icon">♥</div>
                                <div>
                                    <span class="engagement-number">${post.likes}</span>
                                    <span>people engaged</span>
                                </div>
                            </div>
                            <div class="engagement-item">
                                <div class="engagement-icon">💬</div>
                                <div>
                                    <span class="engagement-number">${post.comments}</span>
                                    <span>conversations</span>
                                </div>
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
