<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 14: Japanese Minimal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'Georgia', serif;
            background: #fafaf8;
            color: #333;
            line-height: 1.8;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 100px;
        }

        header h1 {
            font-size: 1.8em;
            font-weight: 300;
            letter-spacing: 8px;
            color: #2a2a2a;
            margin-bottom: 20px;
        }

        header .subtitle {
            font-size: 0.9em;
            color: #999;
            letter-spacing: 4px;
        }

        .post {
            margin-bottom: 120px;
        }

        .post-date {
            font-size: 0.75em;
            color: #bbb;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .post-content {
            font-size: 1em;
            line-height: 2.2;
            color: #4a4a4a;
            white-space: pre-wrap;
            margin-bottom: 40px;
        }

        .post img {
            width: 100%;
            margin: 60px 0;
            filter: grayscale(20%) contrast(95%);
        }

        .post-meta {
            font-size: 0.75em;
            color: #ccc;
            text-align: center;
            letter-spacing: 3px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: #ddd;
            margin: 80px auto;
        }

        #posts-container .loading {
            text-align: center;
            padding: 60px;
            color: #ccc;
            font-size: 0.9em;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>NGUYEN TRAM ANH</h1>
            <p class="subtitle">LIVING GRATEFULLY</p>
        </header>

        <div id="posts-container">
            <div class="loading">LOADING</div>
        </div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                posts.forEach((post, index) => {
                    const article = document.createElement('article');
                    article.className = 'post';

                    let displayText = post.text;
                    if (displayText.length > 400) {
                        displayText = displayText.substring(0, 400) + '...';
                    }

                    let imagesHTML = '';
                    if (post.images && post.images.length > 0) {
                        imagesHTML = post.images.slice(0, 1).map(img =>
                            `<img src="../${img}" alt="">`
                        ).join('');
                    }

                    article.innerHTML = `
                        <div class="post-date">${post.date_formatted}</div>
                        <div class="post-content">${displayText}</div>
                        ${imagesHTML}
                        <div class="post-meta">${post.likes} · ${post.comments}</div>
                    `;

                    container.appendChild(article);

                    if (index < posts.length - 1) {
                        const divider = document.createElement('div');
                        divider.className = 'divider';
                        container.appendChild(divider);
                    }
                });
            })
            .catch(error => {
                console.error('Error:', error);
            });
    </script>
</body>
</html>
