<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 10: Magazine Editorial</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Playfair Display', 'Georgia', serif;
            background: white;
            color: #1a1a1a;
        }

        .magazine {
            max-width: 1400px;
            margin: 0 auto;
        }

        .cover {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            position: relative;
        }

        .cover h1 {
            font-size: 6em;
            font-weight: 700;
            letter-spacing: -3px;
            text-transform: uppercase;
        }

        .cover .issue {
            font-size: 1.5em;
            margin-top: 20px;
            font-family: 'Helvetica Neue', sans-serif;
            letter-spacing: 10px;
        }

        .story {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
        }

        .story-image {
            background-size: cover;
            background-position: center;
        }

        .story-content {
            padding: 80px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .story-category {
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 0.9em;
            letter-spacing: 3px;
            color: #667eea;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .story-title {
            font-size: 3.5em;
            line-height: 1.1;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .story-excerpt {
            font-size: 1.3em;
            line-height: 1.8;
            margin-bottom: 30px;
            font-family: 'Georgia', serif;
        }

        .story-meta {
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 0.9em;
            color: #666;
            display: flex;
            gap: 20px;
        }

        .full-bleed {
            width: 100%;
            height: 80vh;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            padding: 60px;
            color: white;
        }

        .full-bleed-content {
            max-width: 600px;
        }

        .full-bleed-content h2 {
            font-size: 4em;
            margin-bottom: 20px;
        }

        .full-bleed-content p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        .quote {
            padding: 100px 80px;
            text-align: center;
            background: #f8f8f8;
        }

        .quote-text {
            font-size: 3em;
            font-style: italic;
            line-height: 1.4;
            max-width: 900px;
            margin: 0 auto 30px;
        }

        .quote-author {
            font-family: 'Helvetica Neue', sans-serif;
            font-size: 1.2em;
            color: #666;
        }

        @media (max-width: 900px) {
            .story {
                grid-template-columns: 1fr;
            }
            .story-image {
                height: 50vh;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.5em;
        }
    </style>
</head>
<body>
    <div class="magazine">
        <div class="cover">
            <div>
                <h1>Nguyen<br>Tram Anh</h1>
                <div class="issue">Issue No. 01 / 2025</div>
            </div>
        </div>

        <div id="posts-container">
            <div class="cover">
                <div class="loading">Loading stories...</div>
            </div>
        </div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                const gradients = [
                    'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                    'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                    'linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)',
                    'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',
                    'linear-gradient(135deg, #fa709a 0%, #fee140 100%)',
                    'linear-gradient(135deg, #30cfd0 0%, #330867 100%)'
                ];

                const categories = ['Life / Reflection', 'Family / Love', 'Education / Growth', 
                                  'Journey / Experience', 'Faith / Gratitude', 'Wisdom / Thoughts'];

                posts.forEach((post, index) => {
                    let displayText = post.text;
                    if (displayText.length > 400) {
                        displayText = displayText.substring(0, 400) + '...';
                    }

                    // Extract title
                    const firstLine = post.text.split('\n')[0];
                    const title = firstLine.length > 60 ? firstLine.substring(0, 60) : firstLine;

                    const gradient = gradients[index % gradients.length];
                    const category = categories[index % categories.length];

                    // Format date
                    const date = new Date(post.date);
                    const months = ['January', 'February', 'March', 'April', 'May', 'June', 
                                  'July', 'August', 'September', 'October', 'November', 'December'];
                    const formattedDate = `${months[date.getMonth()]} ${date.getDate()}, ${date.getFullYear()}`;

                    if (index % 3 === 0) {
                        // Regular story layout
                        const story = document.createElement('div');
                        story.className = 'story';

                        let imageStyle = `background: ${gradient};`;
                        if (post.images && post.images.length > 0) {
                            imageStyle = `background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('../${post.images[0]}');
                                        background-size: cover;
                                        background-position: center;`;
                        }

                        story.innerHTML = `
                            <div class="story-content">
                                <div class="story-category">${category}</div>
                                <h2 class="story-title">${title}</h2>
                                <div class="story-excerpt">${displayText}</div>
                                <div class="story-meta">
                                    <span>${formattedDate}</span>
                                    <span>${post.likes} Reactions</span>
                                </div>
                            </div>
                            <div class="story-image" style="${imageStyle}"></div>
                        `;

                        container.appendChild(story);
                    } else if (index % 3 === 1 && post.images && post.images.length > 0) {
                        // Full bleed image layout
                        const fullBleed = document.createElement('div');
                        fullBleed.className = 'full-bleed';
                        fullBleed.style.background = `linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.6)), url('../${post.images[0]}')`;
                        fullBleed.style.backgroundSize = 'cover';
                        fullBleed.style.backgroundPosition = 'center';

                        fullBleed.innerHTML = `
                            <div class="full-bleed-content">
                                <h2>${title}</h2>
                                <p>${displayText}</p>
                            </div>
                        `;

                        container.appendChild(fullBleed);
                    } else {
                        // Quote layout
                        const quote = document.createElement('div');
                        quote.className = 'quote';

                        quote.innerHTML = `
                            <div class="quote-text">"${displayText}"</div>
                            <div class="quote-author">— Nguyen Tram Anh, ${months[date.getMonth()]} ${date.getFullYear()}</div>
                        `;

                        container.appendChild(quote);
                    }
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('posts-container').innerHTML = 
                    '<div class="cover"><div class="loading">Error loading stories</div></div>';
            });
    </script>
</body>
</html>
