<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 2: Pinterest Masonry</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #fff;
            color: #333;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .masonry {
            column-count: 3;
            column-gap: 20px;
        }

        @media (max-width: 900px) {
            .masonry {
                column-count: 2;
            }
        }

        @media (max-width: 600px) {
            .masonry {
                column-count: 1;
            }
        }

        .card {
            break-inside: avoid;
            margin-bottom: 20px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transform: translateY(-4px);
        }

        .card img {
            width: 100%;
            display: block;
        }

        .card-content {
            padding: 16px;
        }

        .card-text {
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .card-meta {
            font-size: 0.85em;
            color: #666;
            display: flex;
            gap: 12px;
        }

        .card-date {
            font-size: 0.8em;
            color: #999;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Nguyen Tram Anh</h1>
        <p>Digital Creator</p>
    </header>

    <div class="masonry" id="posts-container">
        <div class="loading" style="text-align: center; padding: 40px; color: #999;">Loading posts...</div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    let displayText = post.text;
                    if (displayText.length > 200) {
                        displayText = displayText.substring(0, 200) + '...';
                    }

                    let imageHTML = '';
                    if (post.images && post.images.length > 0) {
                        imageHTML = `<img src="../${post.images[0]}" alt="">`;
                    }

                    card.innerHTML = `
                        ${imageHTML}
                        <div class="card-content">
                            <div class="card-date">${post.date_formatted}</div>
                            <div class="card-text">${displayText}</div>
                            <div class="card-meta">
                                <span>❤️ ${post.likes}</span>
                                <span>💬 ${post.comments}</span>
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
