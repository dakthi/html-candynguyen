<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 21: Walking Tour Map</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #f5f1e8;
            color: #2c2416;
            padding: 20px;
        }

        .map-container {
            max-width: 900px;
            margin: 0 auto;
            background: #fefdfb;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 3px solid #8b7355;
            position: relative;
        }

        .compass {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border: 2px solid #c41e3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            font-weight: bold;
            color: #c41e3a;
            font-size: 1.2em;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px double #8b7355;
        }

        header h1 {
            font-size: 2.5em;
            color: #1a3a52;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        header p {
            font-size: 1.1em;
            color: #8b7355;
            font-style: italic;
        }

        .route {
            margin-bottom: 50px;
            position: relative;
            padding-left: 80px;
        }

        .marker {
            position: absolute;
            left: 0;
            top: 0;
            width: 50px;
            height: 50px;
            background: #c41e3a;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 1.2em;
            border: 3px solid white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .marker-number {
            transform: rotate(45deg);
        }

        .route-content {
            background: #f9f7f4;
            padding: 25px;
            border-left: 4px solid #c41e3a;
            margin-bottom: 20px;
        }

        .route-date {
            font-size: 0.9em;
            color: #8b7355;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .route-title {
            font-size: 1.4em;
            color: #1a3a52;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .route-text {
            line-height: 1.8;
            color: #2c2416;
            margin-bottom: 15px;
        }

        .route img {
            width: 100%;
            margin: 20px 0;
            border: 5px solid white;
            box-shadow: 0 3px 15px rgba(0,0,0,0.2);
        }

        .route-meta {
            display: flex;
            gap: 20px;
            font-size: 0.9em;
            color: #666;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #c4b5a0;
        }

        .dashed-line {
            border-left: 3px dashed #c41e3a;
            height: 30px;
            margin-left: 23px;
            opacity: 0.5;
        }

        #routes-container .loading {
            text-align: center;
            padding: 60px;
            color: #8b7355;
        }
    </style>
</head>
<body>
    <div class="map-container">
        <div class="compass">N</div>

        <header>
            <h1>Walking Routes</h1>
            <p>A Journey Through Stories & Places</p>
        </header>

        <div id="routes-container">
            <div class="loading">Loading routes...</div>
        </div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('routes-container');
                container.innerHTML = '';

                posts.forEach((post, index) => {
                    const route = document.createElement('div');
                    route.className = 'route';

                    let displayText = post.text;
                    if (displayText.length > 400) {
                        displayText = displayText.substring(0, 400) + '...';
                    }

                    // Extract first sentence as title
                    const firstSentence = displayText.split(/[.!?]/)[0];
                    const title = firstSentence.length > 60
                        ? firstSentence.substring(0, 60) + '...'
                        : firstSentence;

                    let imageHTML = '';
                    if (post.images && post.images.length > 0) {
                        imageHTML = `<img src="../${post.images[0]}" alt="Route photo">`;
                    }

                    route.innerHTML = `
                        <div class="marker">
                            <span class="marker-number">${index + 1}</span>
                        </div>
                        <div class="route-content">
                            <div class="route-date">${post.date_formatted}</div>
                            <div class="route-title">${title}</div>
                            <div class="route-text">${displayText}</div>
                            ${imageHTML}
                            <div class="route-meta">
                                <span>❤️ ${post.likes} explorers</span>
                                <span>💬 ${post.comments} stories shared</span>
                            </div>
                        </div>
                    `;

                    container.appendChild(route);

                    // Add dashed line between markers (except after last one)
                    if (index < posts.length - 1) {
                        const line = document.createElement('div');
                        line.className = 'dashed-line';
                        container.appendChild(line);
                    }
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
