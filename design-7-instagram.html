<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 7: Instagram Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            padding: 20px;
        }

        .container {
            max-width: 975px;
            margin: 0 auto;
        }

        .profile {
            background: white;
            border: 1px solid #dbdbdb;
            padding: 30px;
            margin-bottom: 30px;
            display: flex;
            gap: 40px;
            align-items: center;
        }

        .profile-pic {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .profile-pic img {
            width: 142px;
            height: 142px;
            border-radius: 50%;
            background: white;
            object-fit: cover;
        }

        .profile-info h1 {
            font-size: 28px;
            font-weight: 300;
            margin-bottom: 20px;
        }

        .profile-stats {
            display: flex;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .profile-stats span {
            font-weight: 600;
        }

        .profile-bio {
            font-size: 14px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        @media (max-width: 768px) {
            .grid {
                gap: 5px;
            }
        }

        .grid-item {
            position: relative;
            aspect-ratio: 1;
            cursor: pointer;
            overflow: hidden;
        }

        .grid-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            color: white;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .grid-item:hover .grid-overlay {
            opacity: 1;
        }

        .grid-overlay span {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 60px;
            border-top: 1px solid #dbdbdb;
            padding: 20px 0;
            margin-bottom: 30px;
            background: white;
            border-bottom: 1px solid #dbdbdb;
        }

        .tabs a {
            color: #8e8e8e;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tabs a.active {
            color: #262626;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile">
            <div class="profile-pic">
                <img src="https://via.placeholder.com/142/e1bee7/6a1b9a?text=TA" alt="Profile">
            </div>
            <div class="profile-info">
                <h1>nguyen_tramanh</h1>
                <div class="profile-stats">
                    <div><span id="post-count">0</span> posts</div>
                    <div><span>6,325</span> followers</div>
                    <div><span>1,400</span> following</div>
                </div>
                <div class="profile-bio">
                    <strong>Nguyen Tram Anh</strong><br>
                    Digital Creator<br>
                    Sống trong tâm tình biết ơn<br>
                    📍 Ho Chi Minh City, Vietnam
                </div>
            </div>
        </div>

        <div class="tabs">
            <a href="#" class="active">Posts</a>
            <a href="#">Saved</a>
            <a href="#">Tagged</a>
        </div>

        <div class="grid" id="posts-container">
            <div class="loading">Loading posts...</div>
        </div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                // Update post count
                document.getElementById('post-count').textContent = posts.length;

                posts.forEach(post => {
                    // Only show posts with images
                    if (post.images && post.images.length > 0) {
                        const gridItem = document.createElement('div');
                        gridItem.className = 'grid-item';

                        gridItem.innerHTML = `
                            <img src="../${post.images[0]}" alt="">
                            <div class="grid-overlay">
                                <span>❤️ ${post.likes}</span>
                                <span>💬 ${post.comments}</span>
                            </div>
                        `;

                        container.appendChild(gridItem);
                    }
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('posts-container').innerHTML = 
                    '<div class="loading">Error loading posts</div>';
            });
    </script>
</body>
</html>
