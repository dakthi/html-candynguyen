<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 23: Heritage Plaques</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #e8dcc4;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        header h1 {
            font-size: 3em;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: normal;
        }

        header p {
            font-size: 1.2em;
            color: #7f8c8d;
            font-style: italic;
        }

        .plaque {
            background: radial-gradient(circle at 30% 30%, #4a90e2, #2e5c8a);
            border-radius: 50%;
            width: 100%;
            aspect-ratio: 1;
            max-width: 500px;
            margin: 0 auto 50px;
            padding: 50px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
            border: 12px solid #fff;
        }

        .plaque::before {
            content: '';
            position: absolute;
            inset: -20px;
            background: #34495e;
            border-radius: 50%;
            z-index: -1;
        }

        .plaque-header {
            font-size: 0.9em;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .plaque-title {
            font-size: 1.8em;
            font-weight: bold;
            line-height: 1.3;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .plaque-text {
            font-size: 1em;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .plaque-date {
            font-size: 1.1em;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: auto;
        }

        .plaque-footer {
            margin-top: 15px;
            font-size: 0.85em;
            opacity: 0.8;
        }

        .photo-section {
            margin: 30px 0;
        }

        .photo-section img {
            width: 100%;
            border: 8px solid white;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .engagement {
            text-align: center;
            margin-top: 20px;
            font-size: 0.95em;
            color: #555;
        }

        #plaques-container .loading {
            text-align: center;
            padding: 60px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Heritage Walks</h1>
            <p>Commemorating Stories & Places</p>
        </header>

        <div id="plaques-container">
            <div class="loading">Loading heritage plaques...</div>
        </div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('plaques-container');
                container.innerHTML = '';

                posts.forEach((post, index) => {
                    const section = document.createElement('div');
                    section.style.marginBottom = '80px';

                    let displayText = post.text;
                    if (displayText.length > 200) {
                        displayText = displayText.substring(0, 200) + '...';
                    }

                    // Extract title from first sentence
                    const sentences = displayText.split(/[.!?]/);
                    const title = sentences[0].length > 50
                        ? sentences[0].substring(0, 50)
                        : sentences[0];

                    // Get year from date
                    const year = new Date(post.date).getFullYear();

                    let photoHTML = '';
                    if (post.images && post.images.length > 0) {
                        photoHTML = `
                            <div class="photo-section">
                                <img src="../${post.images[0]}" alt="">
                            </div>
                        `;
                    }

                    section.innerHTML = `
                        <div class="plaque">
                            <div class="plaque-header">In Memory Of</div>
                            <div class="plaque-title">${title}</div>
                            <div class="plaque-text">${displayText}</div>
                            <div class="plaque-date">${year}</div>
                            <div class="plaque-footer">${post.date_formatted}</div>
                        </div>
                        ${photoHTML}
                        <div class="engagement">
                            ❤️ ${post.likes} visitors &nbsp;•&nbsp; 💬 ${post.comments} reflections
                        </div>
                    `;

                    container.appendChild(section);
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
