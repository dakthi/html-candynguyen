<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 24: Tour Guide's Notebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', 'Courier', monospace;
            background: #8b7355;
            padding: 40px 20px;
        }

        .notebook {
            max-width: 750px;
            margin: 0 auto;
            background: #fff8e7;
            padding: 60px 50px 60px 80px;
            box-shadow: -5px 0 0 #c41e3a, 0 10px 40px rgba(0,0,0,0.3);
            position: relative;
            background-image: repeating-linear-gradient(
                transparent,
                transparent 31px,
                #e0d5c7 31px,
                #e0d5c7 32px
            );
            min-height: 100vh;
        }

        .notebook::before {
            content: '';
            position: absolute;
            left: 60px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #e8d5c4;
        }

        /* Spiral binding holes */
        .spiral-hole {
            position: absolute;
            left: 15px;
            width: 20px;
            height: 20px;
            background: #8b7355;
            border-radius: 50%;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .hole-1 { top: 100px; }
        .hole-2 { top: 250px; }
        .hole-3 { top: 400px; }
        .hole-4 { top: 550px; }

        header {
            margin-bottom: 50px;
            padding-bottom: 20px;
            border-bottom: 3px solid #c41e3a;
        }

        header h1 {
            font-size: 2.2em;
            color: #2c2416;
            margin-bottom: 8px;
            text-decoration: underline;
            text-decoration-color: #c41e3a;
        }

        header p {
            font-size: 1em;
            color: #666;
            font-style: italic;
        }

        .entry {
            margin-bottom: 50px;
            position: relative;
        }

        .entry-tab {
            position: absolute;
            right: -50px;
            top: 0;
            background: #c41e3a;
            color: white;
            padding: 8px 15px;
            font-size: 0.8em;
            font-weight: bold;
            writing-mode: vertical-lr;
            transform: rotate(180deg);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .entry-date {
            font-size: 1em;
            color: #c41e3a;
            font-weight: bold;
            margin-bottom: 15px;
            text-decoration: underline;
        }

        .entry-heading {
            font-size: 1.3em;
            color: #2c2416;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .entry-text {
            line-height: 2;
            color: #2c2416;
            margin-bottom: 20px;
            font-size: 1em;
        }

        .entry-image {
            margin: 25px 0;
            position: relative;
        }

        .entry-image img {
            width: 100%;
            border: 2px solid #2c2416;
            box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
        }

        .photo-note {
            position: absolute;
            bottom: -15px;
            right: -15px;
            background: #ffeb3b;
            padding: 10px 15px;
            font-size: 0.85em;
            color: #2c2416;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
            transform: rotate(3deg);
            max-width: 200px;
        }

        .entry-notes {
            background: #f0e5d8;
            border-left: 4px solid #c41e3a;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
        }

        .entry-notes::before {
            content: '📝 NOTES:';
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #c41e3a;
        }

        .checkmark {
            color: #2ecc71;
            font-weight: bold;
            margin-right: 5px;
        }

        #entries-container .loading {
            text-align: center;
            padding: 60px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="notebook">
        <div class="spiral-hole hole-1"></div>
        <div class="spiral-hole hole-2"></div>
        <div class="spiral-hole hole-3"></div>
        <div class="spiral-hole hole-4"></div>

        <header>
            <h1>TOUR GUIDE'S FIELD NOTES</h1>
            <p>Personal observations & participant stories</p>
        </header>

        <div id="entries-container">
            <div class="loading">Loading field notes...</div>
        </div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('entries-container');
                container.innerHTML = '';

                posts.forEach((post, index) => {
                    const entry = document.createElement('div');
                    entry.className = 'entry';

                    let displayText = post.text;
                    if (displayText.length > 350) {
                        displayText = displayText.substring(0, 350) + '...';
                    }

                    // Extract heading
                    const firstLine = displayText.split(/[.!?\n]/)[0];
                    const heading = firstLine.length > 40
                        ? firstLine.substring(0, 40) + '...'
                        : firstLine;

                    let imageHTML = '';
                    if (post.images && post.images.length > 0) {
                        imageHTML = `
                            <div class="entry-image">
                                <img src="../${post.images[0]}" alt="">
                                <div class="photo-note">Photo from tour #${index + 1}</div>
                            </div>
                        `;
                    }

                    entry.innerHTML = `
                        <div class="entry-tab">STOP ${index + 1}</div>
                        <div class="entry-date">${post.date_formatted}</div>
                        <div class="entry-heading">${heading}</div>
                        <div class="entry-text">${displayText}</div>
                        ${imageHTML}
                        <div class="entry-notes">
                            <span class="checkmark">✓</span> ${post.likes} participants engaged<br>
                            <span class="checkmark">✓</span> ${post.comments} stories shared
                        </div>
                    `;

                    container.appendChild(entry);
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
