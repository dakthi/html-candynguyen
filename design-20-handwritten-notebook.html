<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 20: Handwritten Notebook</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Caveat', 'Comic Sans MS', cursive;
            background: #e8e4dc;
            padding: 40px 20px;
        }

        .notebook {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            background-image: repeating-linear-gradient(
                transparent 0px,
                transparent 39px,
                #e8d5d5 39px,
                #e8d5d5 40px
            );
            background-position: 0 30px;
            padding: 60px 80px 60px 100px;
            box-shadow: -10px 0 0 #ff7f7f, 0 10px 30px rgba(0,0,0,0.2);
            position: relative;
        }

        .notebook::before {
            content: '';
            position: absolute;
            left: 70px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ff7f7f;
        }

        .hole {
            position: absolute;
            left: 30px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #e8e4dc;
            border: 2px solid #ccc;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .hole-1 { top: 100px; }
        .hole-2 { top: 300px; }
        .hole-3 { top: 500px; }

        header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 30px;
            border-bottom: 3px solid #333;
        }

        header h1 {
            font-size: 3em;
            color: #2a5a8b;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.5em;
            color: #8b6f47;
        }

        .note {
            margin-bottom: 50px;
            line-height: 40px;
        }

        .note-date {
            font-size: 1.3em;
            color: #ff7f7f;
            margin-bottom: 10px;
        }

        .note-text {
            font-size: 1.4em;
            color: #2a2a2a;
            white-space: pre-wrap;
            margin-bottom: 20px;
        }

        .note img {
            width: 100%;
            margin: 20px 0;
            border: 3px solid #333;
            transform: rotate(-1deg);
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .note-footer {
            font-size: 1.1em;
            color: #8b6f47;
            text-align: right;
            margin-top: 15px;
        }

        .doodle {
            font-size: 2em;
            text-align: center;
            margin: 30px 0;
        }

        #notes-container .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.5em;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="notebook">
        <div class="hole hole-1"></div>
        <div class="hole hole-2"></div>
        <div class="hole hole-3"></div>

        <header>
            <h1>Nguyen Tram Anh</h1>
            <p>My Personal Notebook ✏️</p>
        </header>

        <div id="notes-container">
            <div class="loading">Loading notes...</div>
        </div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('notes-container');
                container.innerHTML = '';

                posts.forEach((post, index) => {
                    const note = document.createElement('div');
                    note.className = 'note';

                    let displayText = post.text;
                    if (displayText.length > 400) {
                        displayText = displayText.substring(0, 400) + '...';
                    }

                    let imagesHTML = '';
                    if (post.images && post.images.length > 0) {
                        imagesHTML = post.images.slice(0, 1).map(img =>
                            `<img src="../${img}" alt="">`
                        ).join('');
                    }

                    note.innerHTML = `
                        <div class="note-date">📅 ${post.date_formatted}</div>
                        <div class="note-text">${displayText}</div>
                        ${imagesHTML}
                        <div class="note-footer">
                            ❤️ ${post.likes} likes ~ 💬 ${post.comments} comments
                        </div>
                    `;

                    container.appendChild(note);

                    if (index < posts.length - 1) {
                        const doodle = document.createElement('div');
                        doodle.className = 'doodle';
                        doodle.textContent = '~ ~ ~ ✨ ~ ~ ~';
                        container.appendChild(doodle);
                    }
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
