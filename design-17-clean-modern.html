<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design 17: Clean Modern</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: white;
            color: #1a1a1a;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        header {
            margin-bottom: 80px;
        }

        header h1 {
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 8px;
        }

        header p {
            font-size: 1em;
            color: #666;
        }

        article {
            margin-bottom: 80px;
        }

        .post-date {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 20px;
        }

        .post-content {
            font-size: 1.05em;
            line-height: 1.7;
            color: #333;
            white-space: pre-wrap;
            margin-bottom: 24px;
        }

        article img {
            width: 100%;
            margin: 32px 0;
            border-radius: 4px;
        }

        .post-stats {
            font-size: 0.9em;
            color: #666;
            padding-top: 16px;
            border-top: 1px solid #eee;
        }

        #posts-container .loading {
            text-align: center;
            padding: 60px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Nguyen Tram Anh</h1>
            <p>Sống trong tâm tình biết ơn</p>
        </header>

        <div id="posts-container">
            <div class="loading">Loading...</div>
        </div>
    </div>

    <script>
        fetch('../curated_posts.json')
            .then(response => response.json())
            .then(posts => {
                const container = document.getElementById('posts-container');
                container.innerHTML = '';

                posts.forEach(post => {
                    const article = document.createElement('article');

                    let displayText = post.text;
                    if (displayText.length > 600) {
                        displayText = displayText.substring(0, 600) + '...';
                    }

                    let imagesHTML = '';
                    if (post.images && post.images.length > 0) {
                        imagesHTML = post.images.slice(0, 1).map(img =>
                            `<img src="../${img}" alt="" loading="lazy">`
                        ).join('');
                    }

                    article.innerHTML = `
                        <div class="post-date">${post.date_formatted}</div>
                        <div class="post-content">${displayText}</div>
                        ${imagesHTML}
                        <div class="post-stats">${post.likes} likes · ${post.comments} comments</div>
                    `;

                    container.appendChild(article);
                });
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>
</html>
